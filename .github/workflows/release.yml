name: Release
# Push a tag such as v0.9.1 to build the extension, attach it to a GitHub release,
# and publish it to the registries for which you have added a token secret.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --no-dependencies
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX (used by Positron, VSCodium, Cursor, ...)
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix
